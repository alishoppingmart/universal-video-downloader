name: Build AI Video Studio (Android .apk)

on:
  push:
    paths:
      - "mobile/**"
      - "main.py"
      - "buildozer.spec"
      - "ai_video_studio/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build-android:
    # Pinned to 22.04: it still has the older system libs (libtinfo5, etc.)
    # that python-for-android needs, avoiding breakage on newer images.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config automake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          # Cython 0.29.x is what python-for-android expects (Cython 3 breaks it).
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Build the APK (debug)
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIVideoStudio-APK
          path: bin/*.apk
